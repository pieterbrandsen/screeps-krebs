<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run Broadcast</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #050910; color: #edf5ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 0%, #183559 0, #07111d 38%, #03070c 100%); }
    .stage { position: fixed; inset: 0; overflow: hidden; background: #101d2e; }
    iframe { width: 100%; height: 100%; border: 0; background: #101d2e; }
    .shade { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px #020508aa; }
    header, .lower-third, .hint { position: fixed; z-index: 2; pointer-events: none; }
    header { top: 24px; left: 28px; right: 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand, .control, .lower-third { background: #07121ee6; border: 1px solid #79c8ff44; box-shadow: 0 12px 40px #000a; backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 12px; padding: 10px 15px; border-radius: 12px; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 800; }
    .signal { width: 9px; height: 9px; border-radius: 50%; background: #4dffb8; box-shadow: 0 0 14px #4dffb8; }
    .control { display: flex; align-items: center; gap: 9px; padding: 7px; border-radius: 12px; pointer-events: auto; }
    input { width: 86px; border: 0; border-radius: 8px; padding: 9px 10px; background: #13263a; color: #edf5ff; font: 700 13px ui-monospace, SFMono-Regular, monospace; text-transform: uppercase; outline: none; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #55bfff; color: #04111d; font-weight: 800; cursor: pointer; }
    .lower-third { left: 28px; bottom: 28px; max-width: 340px; padding: 14px 17px; border-radius: 12px; }
    .eyebrow { color: #82cdff; font-size: 10px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    .room { margin-top: 3px; font: 800 28px ui-monospace, SFMono-Regular, monospace; letter-spacing: .06em; }
    .sub { margin-top: 3px; color: #b6cce1; font-size: 12px; }
    .hint { right: 30px; bottom: 30px; color: #d9e6f344; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    body.clean header, body.clean .lower-third, body.clean .hint, body.clean .shade { opacity: 0; }
    @media (max-width: 640px) { header { top: 12px; left: 12px; right: 12px; } .lower-third { left: 12px; bottom: 12px; } .hint { display: none; } }
  </style>
</head>
<body>
  <main id="stage" class="stage"><iframe id="client" title="Screeps room view" allow="fullscreen"></iframe></main>
  <div class="shade"></div>
  <header>
    <div class="brand"><span class="signal"></span> Run Broadcast</div>
    <form class="control" id="room-form"><input id="room" aria-label="Room name" value="W7N3" maxlength="8" pattern="[WE][0-9]+[NS][0-9]+"><button>Watch</button></form>
  </header>
  <aside class="lower-third"><div class="eyebrow">Live Screeps performance run</div><div id="room-label" class="room">W7N3</div><div class="sub">F toggles fullscreen · H hides the broadcast shell</div></aside>
  <div class="hint">Open Broadcast in OBS or a browser capture</div>
  <script>
    (() => {
      const valid = /^[WE]\d+[NS]\d+$/;
      const input = document.getElementById('room');
      const label = document.getElementById('room-label');
      const client = document.getElementById('client');
      const roomFromUrl = new URLSearchParams(location.search).get('room');
      function show(room) {
        const safe = room.toUpperCase();
        if (!valid.test(safe)) { input.setCustomValidity('Use a Screeps room name, e.g. W7N3'); input.reportValidity(); return; }
        input.setCustomValidity('');
        input.value = safe;
        label.textContent = safe;
        client.src = '/client/#!/room/shard0/' + encodeURIComponent(safe);
        history.replaceState(null, '', '/broadcast?room=' + encodeURIComponent(safe));
      }
      document.getElementById('room-form').addEventListener('submit', (event) => { event.preventDefault(); show(input.value); });
      document.addEventListener('keydown', (event) => {
        if (event.target === input) return;
        if (event.key.toLowerCase() === 'h') document.body.classList.toggle('clean');
        if (event.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
      });
      show(valid.test((roomFromUrl || '').toUpperCase()) ? roomFromUrl : input.value);
    })();
  </script>
</body>
</html>
